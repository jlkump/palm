[package]
name = "palm-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
reqwest = "0.13.4"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.24.0", features = ["serde"] }
