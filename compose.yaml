networks:
  palm-backend:
    external: false

services:
  db:
    image: "postgres:14"

    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_database

    volumes:
      - ./postgres:/var/lib/postgresql/data
    # switch to this once we got it hooked up on the server
    #env_file:
    #  - .env
    ports:
      - "5432:5432"
    networks:
      - palm-backend

  rust:
    container_name: rust
    image: palm-backend:local
    build:
      context: ./palm-backend/
      dockerfile: rust.dockerfile
    environment:
      DATABASE_CREDS: postgres://username:password@db:5432/default_database
    ports:
      - "9000:3000"
    depends_on:
      - db
    networks:
      - palm-backend
